# Nome da aplicação
spring.application.name=e-sports

# URL de conexão com o MySQL.
# serverTimezone define o fuso horário utilizado na conexão.
spring.datasource.url=jdbc:mysql://localhost:3306/esports?serverTimezone=America/Sao_Paulo

# Usuário do MySQL definido por variável de ambiente
spring.datasource.username=${MYSQL_USUARIO}

# Senha do MySQL definida por variável de ambiente
spring.datasource.password=${MYSQL_SENHA}

# Driver utilizado para conectar ao MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Atualiza as tabelas no ambiente de desenvolvimento, sem recriá-las
spring.jpa.hibernate.ddl-auto=update

# Exibe os comandos SQL no console
spring.jpa.show-sql=true

# Formata os comandos SQL exibidos no console
spring.jpa.properties.hibernate.format_sql=true

# Define o dialeto do Hibernate para MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

server.port=8080
